services:
  web:
    build: .
    ports:
      - "8001:8000"
    volumes:
      - .:/app
      - /app/.venv
    env_file:
      - .env
    depends_on:
      - db
      - redis
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: innotter
      MYSQL_USER: innotter_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  redis:
    image: redis:7-alpine
volumes:
  mysql_data:
